apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: loja-translite
  labels:
    cloud.googleapis.com/location: europe-west1
    app.kubernetes.io/name: loja-translite
    app.kubernetes.io/part-of: translite-ecosystem
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '10'
        run.googleapis.com/cpu-boost: 'true'
        run.googleapis.com/startup-cpu-boost: 'true'
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: translite-run-sa@$PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: europe-west1-docker.pkg.dev/$PROJECT_ID/translite-repo/loja-translite:latest
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits:
              cpu: '1000m'
              memory: '512Mi'
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '3000'
            # Segredos integrados do Google Secret Manager (opcional)
            # - name: DATABASE_URL
            #   valueFrom:
            #     secretKeyRef:
            #       name: clouds-sql-db-url
            #       key: 'latest'
          startupProbe:
            httpGet:
              path: /api/livez
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/livez
              port: 3000
            periodSeconds: 15
            failureThreshold: 3
  traffic:
    - percent: 100
      latestRevision: true
