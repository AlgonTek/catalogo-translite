# ==============================================================================
# GOOGLE CLOUD BUILD - PIPELINE DE CI/CD PARA CLOUD RUN (REFERENCE ARCHITECTURE)
# ==============================================================================
# Pipeline completa para compilar a aplicação Fullstack (Vite + Express/Node.js),
# gerar imagem Docker otimizada multi-stage no Artifact Registry e realizar
# o deploy contínuo com Zero-Downtime no Google Cloud Run.
# ==============================================================================

steps:
  # 1. Build da Imagem Docker com cache de camadas do Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:latest'
      - '-t'
      - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$COMMIT_SHA'
      - '-t'
      - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:latest'
      - '.'
    id: 'docker-build'

  # 2. Push das tags para o Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME'
    id: 'docker-push'
    waitFor: ['docker-build']

  # 3. Deploy no Google Cloud Run com especificações da Arquitetura de Referência
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image=$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region=$_DEPLOY_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--concurrency=80'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--cpu-boost'
      - '--set-env-vars=NODE_ENV=production'
      # Se utilizar Cloud SQL (PostgreSQL), descomente a linha abaixo para injetar o conector VPC/Socket:
      # - '--add-cloudsql-instances=$PROJECT_ID:$_DEPLOY_REGION:$_CLOUDSQL_INSTANCE_NAME'
    id: 'cloud-run-deploy'
    waitFor: ['docker-push']

images:
  - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$COMMIT_SHA'
  - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:latest'

substitutions:
  _AR_REGION: 'europe-west1'
  _DEPLOY_REGION: 'europe-west1'
  _AR_REPO: 'translite-repo'
  _SERVICE_NAME: 'loja-translite'

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
